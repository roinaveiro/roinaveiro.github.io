<!doctype html>
<html lang="{{ site.locale | default: 'en' | slice: 0, 2 }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.url == '/' %}Roi Naveiro{% else %}{{ page.title | escape }} · Roi Naveiro{% endif %}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:title" content="{{ page.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#faf9f6">
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/minimal.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header site-width">
      <a class="site-name" href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Roi Naveiro</a>
      <nav aria-label="Main navigation">
        {% for item in site.data.navigation.main %}
        <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
        {% endfor %}
      </nav>
    </header>
    <main id="main" class="site-width page-content{% if page.page_kind == 'home' %} home-page{% endif %}">
      {% unless page.page_kind == 'home' %}<h1>{{ page.title }}</h1>{% endunless %}
      {{ content }}
    </main>
    <footer class="site-footer site-width">
      <span>© {{ site.time | date: '%Y' }} Roi Naveiro</span>
      <nav aria-label="Further information">
        <a href="{{ '/cv/' | relative_url }}"{% if page.url == '/cv/' %} aria-current="page"{% endif %}>CV</a>
        <a href="{{ site.author.googlescholar }}">Google Scholar</a>
        <a href="mailto:{{ site.author.email }}">Email</a>
      </nav>
    </footer>
  </body>
</html>
